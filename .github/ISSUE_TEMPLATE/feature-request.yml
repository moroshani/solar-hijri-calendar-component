name: Feature request
description: Propose a scoped product or API improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which user or developer problem needs to be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the API and interaction without assuming a specific implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope checks
      options:
        - label: I considered Persian and RTL behavior.
          required: true
        - label: I considered accessibility and keyboard behavior.
          required: true
        - label: I searched existing issues and pull requests.
          required: true

